[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rohlik-cookidoo"
version = "0.2.0"
description = "Turns a Cookidoo weekly meal plan into a Rohlik.cz shopping cart"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9,<4",
    "cookidoo-api>=0.17,<0.19",
    "fastmcp>=3.1,<4",
    "mcp>=1.26,<2",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.setuptools]
packages = ["rohlik_cookidoo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
